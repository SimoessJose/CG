<!DOCTYPE html>
<html>
   <head>
      <title>Basic Scene - FPAA</title>

      <link rel="shortcut icon" href="../favicon.ico">
      <link rel="stylesheet" href="../html/resources/default.css">
      <meta name="viewport" content="width=device-width, initial-scale=1">  
      
      <!-- Estilos da Mira (Crosshair) -->
      <style>
         #crosshair {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 20px;
            height: 20px;
            transform: translate(-50%, -50%);
            /* O pointer-events: none é crucial para a mira não bloquear o seu clique na tela */
            pointer-events: none; 
            z-index: 100;
         }
         
         /* Linha vertical da cruz */
         #crosshair::before {
            content: "";
            position: absolute;
            top: 0;
            left: 9px; /* Centraliza a linha de 2px no container de 20px */
            width: 2px;
            height: 20px;
            background-color: rgba(255, 255, 255, 0.9);
            box-shadow: 0 0 2px rgba(0, 0, 0, 1); /* Sombra para destacar em fundos claros */
         }
         
         /* Linha horizontal da cruz */
         #crosshair::after {
            content: "";
            position: absolute;
            top: 9px;
            left: 0;
            width: 20px;
            height: 2px;
            background-color: rgba(255, 255, 255, 0.9);
            box-shadow: 0 0 2px rgba(0, 0, 0, 1);
         }
      </style>
   </head>

   <body>
      <!-- Import maps polyfill -->
      <script async src="https://unpkg.com/es-module-shims@1.3.6/dist/es-module-shims.js"></script>  
      <script type="importmap"> 
         {"imports": {"three": "../build/three.module.js"}} 
      </script>  

      <!-- Elemento da Mira renderizado acima do jogo -->
      <div id="crosshair"></div>

      <div id="webgl-output">     
         <script type="module" src="basicScene.js"></script>
      </div>
   </body>
</html>
