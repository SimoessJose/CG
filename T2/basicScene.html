<!DOCTYPE html>
<html lang="pt-BR">
   <head>
      <meta charset="utf-8">
      <title>T2 - First Person Action Adventure (Castelo de Bodiam)</title>

      <link rel="shortcut icon" href="../favicon.ico">
      <link rel="stylesheet" href="../html/resources/default.css">
      <meta name="viewport" content="width=device-width, initial-scale=1">  
      
      <style>
         /* Mira central (Crosshair) */
         #crosshair {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 20px;
            height: 20px;
            transform: translate(-50%, -50%);
            pointer-events: none; 
            z-index: 100;
         }
         
         #crosshair::before {
            content: "";
            position: absolute;
            top: 0;
            left: 9px;
            width: 2px;
            height: 20px;
            background-color: rgba(255, 255, 255, 0.95);
            box-shadow: 0 0 3px rgba(0, 0, 0, 0.9);
         }
         
         #crosshair::after {
            content: "";
            position: absolute;
            top: 9px;
            left: 0;
            width: 20px;
            height: 2px;
            background-color: rgba(255, 255, 255, 0.95);
            box-shadow: 0 0 3px rgba(0, 0, 0, 0.9);
         }

         /* Interface de Chaves (HUD de Inventário Mágico) */
         #keys-hud {
            position: absolute;
            top: 18px;
            right: 20px;
            background: rgba(18, 22, 34, 0.85);
            border: 2px solid #5a7396;
            border-radius: 10px;
            padding: 10px 18px;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            font-size: 14px;
            z-index: 100;
            pointer-events: none;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.6);
            display: flex;
            align-items: center;
            gap: 12px;
         }

         #keys-hud .title {
            font-weight: bold;
            color: #b5c7e4;
            text-transform: uppercase;
            letter-spacing: 1px;
         }

         .key-slots-container {
            display: flex;
            gap: 8px;
         }

         .key-slot {
            width: 20px;
            height: 20px;
            border-radius: 50%;
            background: #252e3d;
            border: 2px solid #4a5970;
            transition: all 0.3s ease;
         }

         .key-slot.active {
            background: #00e5ff;
            border-color: #ffffff;
            box-shadow: 0 0 10px #00e5ff, 0 0 18px #00aacc;
            transform: scale(1.15);
         }

         #key-counter {
            font-weight: bold;
            font-size: 15px;
            color: #00e5ff;
         }

         /* Notificações Flutuantes (Toast) */
         #toast-notification {
            position: absolute;
            bottom: 40px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(14, 18, 28, 0.9);
            color: #f0f4fc;
            border: 1px solid #4b6584;
            border-radius: 8px;
            padding: 12px 24px;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            font-size: 15px;
            font-weight: 500;
            letter-spacing: 0.5px;
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.7);
            z-index: 100;
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.35s ease, transform 0.35s ease;
         }

         #toast-notification.visible {
            opacity: 1;
            transform: translateX(-50%) translateY(-5px);
         }
      </style>
   </head>

   <body>
      <!-- Polyfill para módulos ES -->
      <script async src="https://unpkg.com/es-module-shims@1.3.6/dist/es-module-shims.js"></script>  
      <script type="importmap"> 
         {"imports": {"three": "../build/three.module.js"}} 
      </script>  

      <!-- Mira central -->
      <div id="crosshair"></div>

      <!-- HUD de Inventário de Chaves -->
      <div id="keys-hud">
         <span class="title">Chaves Mágicas:</span>
         <div class="key-slots-container">
            <div class="key-slot" id="slot-0"></div>
            <div class="key-slot" id="slot-1"></div>
            <div class="key-slot" id="slot-2"></div>
            <div class="key-slot" id="slot-3"></div>
         </div>
         <span id="key-counter">0 / 4</span>
      </div>

      <!-- Notificação Toast para feedback de ações -->
      <div id="toast-notification"></div>

      <div id="webgl-output">     
         <script type="module" src="basicScene.js"></script>
      </div>
   </body>
</html>
